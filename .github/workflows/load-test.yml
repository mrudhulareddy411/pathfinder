name: API Load Testing

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'

jobs:
  load-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        
    - name: Start Backend Server
      run: |
        cd backend
        npm ci || npm install
        npm run dev &
        sleep 10 # Wait for server to start
      env:
        PORT: 5000

    - name: Setup k6
      uses: grafana/setup-k6-action@v1

    - name: Run k6 Load Test
      run: |
        cd backend
        k6 run --summary-export=summary.json scripts/load-test.js
      env:
        BACKEND_URL: http://127.0.0.1:5000/api/health

    - name: Parse and Publish Load Test Results
      if: always()
      run: |
        cd backend
        node scripts/parseK6Summary.js
