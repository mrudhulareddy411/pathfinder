name: Security Review & SAST

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Run Web Frontend Security Suite
        run: |
          cd frontend-e2e
          node scripts/generateWebSecuritySuite.js > web_output.txt
          cat web_output.txt
          CRITICAL=$(grep -oP '(?<=Critical Findings: )\d+' web_output.txt || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "Failed: Found $CRITICAL critical frontend vulnerabilities!"
            exit 1
          fi

      - name: Run Backend API Security Suite
        run: |
          cd backend
          node scripts/generateSecuritySuite.js > backend_output.txt
          cat backend_output.txt
          CRITICAL=$(grep -oP '(?<=Critical Findings: )\d+' backend_output.txt || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "Failed: Found $CRITICAL critical backend vulnerabilities!"
            exit 1
          fi
